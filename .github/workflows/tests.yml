name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "numpy>=1.24" "Pillow>=10"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q dial_core.py dial_daemon.py native_effort.py installation.py install.py uninstall.py
